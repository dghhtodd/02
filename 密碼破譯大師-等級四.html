<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3e5dc">
<title>訓練場 四 | 密碼破譯大師</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="description" content="10 位數字，1 至 20，其中一個數字重複出現 2 次，15 次機會。重複數字推理訓練。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="page-play">
<div class="shell">

  <header class="appbar">
    <a class="appbar__back" href="密碼破譯大師-主頁.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>主頁</span>
    </a>
    <div class="appbar__id">
      <h1 class="appbar__title" id="modeTitle">訓練場 四</h1>
      <p class="appbar__spec" id="modeSpec"></p>
    </div>
    <div class="appbar__tools">
      <button class="btn" id="rulesBtn" type="button">玩法</button>
    </div>
  </header>

  <main class="play">
    <div class="board">
      <div class="readbar" id="readbar"></div>
      <div class="history" id="history" aria-live="polite"></div>
      <div class="hintbar" id="hintbar"></div>
      <div class="current" id="current"></div>
      <div class="keys" id="keys"></div>
    </div>
    <aside class="side" id="side"></aside>
  </main>

</div>

<dialog class="result" id="resultDialog"></dialog>

<script>
window.MM_PAGE = {
  kind: "classic",
  id: "l4",
  title: "訓練場 四",
  rules: [
    "10 位數字，1 至 20，其中一個數字重複出現 2 次，其餘不重複。",
    "15 次機會，內建 3 次免費提示。",
    "提示會永久公開一個位置，不會消失。",
    "每次提交後逐格顯示判定。綠為位置正確，藍為數字正確但位置錯了，紅為不在密碼中。"
  ]
};
</script>
<script src="assets/engine.js"></script>
</body>
</html>
