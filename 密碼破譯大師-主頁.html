<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3e5dc">
<title>密碼破譯大師</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="description" content="每天一組數字密碼，全球同一題。逐格判定，靠推理還原答案；另有無盡模式與五個訓練關卡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="page-hub">
<div class="shell">

  <header class="topline">
    <span>每日 00:00 換題</span>
    <a class="topline__link" href="密碼破譯大師-成就.html">成就與提示卡</a>
  </header>

  <main class="wrap hub">

    <header class="masthead">
      <h1 class="masthead__title">密碼破譯大師</h1>
      <div class="masthead__meta">
        <span id="issueDate"></span>
        <span id="issueNo"></span>
      </div>
    </header>

    <div class="front">

      <section class="dispatch area--dispatch" aria-labelledby="dailyTitle">
        <div class="dispatch__head">
          <h2 class="dispatch__title" id="dailyTitle">今日密碼</h2>
        </div>
        <span class="stamp stamp--pending" id="dailyStamp">尚未破譯</span>
        <p class="dispatch__note" id="heroNote"></p>
        <div class="specimen" id="dailySpecimen" aria-hidden="true"></div>
        <div class="panelgrid panelgrid--fields" id="heroStats"></div>
        <div class="dispatch__actions" id="heroActions"></div>
        <p class="dispatch__fine">完成每日密碼可獲得提示卡 1 張。</p>
      </section>

      <section class="register area--endless" aria-labelledby="endlessTitle">
        <header class="register__head">
          <h2 class="register__title" id="endlessTitle">無盡模式</h2>
          <a class="register__link" href="密碼破譯大師-無盡模式.html">進入挑戰</a>
        </header>
        <div id="endlessPanel"></div>
      </section>

      <section class="register area--calendar" aria-labelledby="calendarHeading">
        <header class="register__head">
          <h2 class="register__title" id="calendarHeading">連續紀錄</h2>
          <span class="register__aside" id="streakAside"></span>
        </header>
        <p class="register__month" id="calendarTitle"></p>
        <div class="calendar" id="calendar"></div>
        <p class="register__note">紅印為成功日，劃線為失敗日，粗框為今日。連續日數只計成功日。</p>
      </section>

      <section class="register area--training" aria-labelledby="trainingTitle">
        <header class="register__head">
          <h2 class="register__title" id="trainingTitle">訓練場</h2>
          <span class="register__aside">五個固定關卡</span>
        </header>
        <div class="index" id="training"></div>
        <p class="register__note">固定題型，適合熟習判定規則。每日密碼與無盡模式才是主線。</p>
      </section>

      <section class="register area--wallet" aria-labelledby="walletTitle">
        <header class="register__head">
          <h2 class="register__title" id="walletTitle">提示卡與徽章</h2>
          <a class="register__link" href="密碼破譯大師-成就.html">查看徽章</a>
        </header>
        <div id="achStats"></div>
      </section>

      <section class="register area--rules" aria-labelledby="rulesTitle">
        <header class="register__head">
          <h2 class="register__title" id="rulesTitle">玩法與判定</h2>
        </header>
        <div id="hubRules"></div>
      </section>

    </div>

  </main>

  <footer class="wrap footer">
    <p>所有進度只存在此裝置的瀏覽器內，不會上傳。</p>
    <p>© <span id="year"></span> 密碼破譯大師</p>
  </footer>

</div>

<script>window.MM_PAGE = { kind: "hub" };</script>
<script src="assets/engine.js"></script>
<script src="assets/hub.js"></script>
</body>
</html>
